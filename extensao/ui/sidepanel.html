<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ImovelMap — sessão</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 12px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111; background: #f7f7f8;
      }
      header {
        display: flex; align-items: center; gap: 8px;
        margin-bottom: 10px; position: sticky; top: 0;
        background: #f7f7f8; padding-bottom: 8px; z-index: 2;
      }
      h1 { font-size: 14px; margin: 0; flex: 1; letter-spacing: -.2px; }
      button {
        border: 1px solid #ddd; background: #fff; color: #333;
        border-radius: 7px; padding: 5px 10px; font-size: 11.5px; cursor: pointer;
      }
      .vazio {
        background: #fff; border-radius: 10px; padding: 26px 16px;
        text-align: center; color: #777; font-size: 12.5px;
      }
      .card {
        background: #fff; border-radius: 10px; padding: 10px;
        margin-bottom: 8px; display: grid; grid-template-columns: 64px 1fr;
        gap: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.05);
        text-decoration: none; color: inherit;
      }
      .card img {
        width: 64px; height: 64px; object-fit: cover; border-radius: 7px;
        background: #eee;
      }
      .preco { font-weight: 700; font-size: 14px; }
      .tit {
        font-size: 12px; color: #444; margin: 2px 0 4px;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .end {
        font-size: 11.5px; color: #157f3c; font-weight: 600;
        display: flex; gap: 4px; align-items: baseline;
      }
      .local { font-size: 11px; color: #888; }
      .marca {
        font-size: 9.5px; text-transform: uppercase; letter-spacing: .4px;
        color: #999; margin-top: 3px;
      }
      .resumo { font-size: 11.5px; color: #666; margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Capturados nesta sessão</h1>
      <button id="btnLimpar">Limpar</button>
    </header>
    <div class="resumo" id="resumo"></div>
    <div id="lista"></div>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
